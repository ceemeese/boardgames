name: Docker Image CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build backend and frontend images from docker-compose
      run: docker compose -f docker-compose.yml build

    - name: Tag and push images
      run: |
        TAG=$(date +%s)
        docker tag boardgame-api ceemeese/boardgames-backend:$TAG
        docker tag boardgame-web ceemeese/boardgames-frontend:$TAG

        docker push ceemeese/boardgames-backend:$(date +%s)
        docker push ceemeese/ceemeese/boardgames-frontend:$(date +%s)



