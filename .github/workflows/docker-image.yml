name: Docker Image CI Multiarch

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Generate TAG
      run: echo "TAG=$(date +%s)" >> $GITHUB_ENV

    - name: Build and push backend multiarch
      run: |
        docker buildx build --platform linux/amd64,linux/arm64 -t ceemeese/boardgames-backend:$TAG -t ceemeese/boardgames-backend:latest ./backend --push

    - name: Build and push frontend multiarch
      run: |
        docker buildx build --platform linux/amd64,linux/arm64 -t ceemeese/boardgames-frontend:$TAG -t ceemeese/boardgames-frontend:latest ./frontend --push



